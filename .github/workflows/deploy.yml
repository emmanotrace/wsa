name: Deploy to codekrew.org

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd /home/codekrew/public_html &&
            git pull origin main &&
            for user in mugerwa musiimen mutakaba nantongo ogwal sekanjak ssebyala tendo; do
              cp -r codecrew/members/$user/. /home/$user/public_html/
              chown -R $user:$user /home/$user/public_html
            done &&
            chown -R codekrew:codekrew /home/codekrew/public_html
          "
